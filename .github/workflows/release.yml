name: Release

# Push a tag like v0.1.0 (it must match the "Version:" line in wpflatfinance.php) and this attaches an installable zip to a GitHub release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: wpflatfinance

      - name: Check the tag matches the plugin version
        run: |
          V=$(grep -m1 '^ \* Version:' wpflatfinance/wpflatfinance.php | awk '{print $3}')
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Version: $V in wpflatfinance.php" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build the zip (the plugin folder, without development files)
        run: |
          zip -rq "wpflatfinance-$VERSION.zip" wpflatfinance \
            -x "wpflatfinance/.git/*" "wpflatfinance/.github/*" "wpflatfinance/.gitignore" "wpflatfinance/ui/*" "wpflatfinance/vite*.js" "wpflatfinance/package*.json" "wpflatfinance/API.md" \
               "wpflatfinance/node_modules/*" "wpflatfinance/lib/dompdf/tests/*" '*.DS_Store'
          cp "wpflatfinance-$VERSION.zip" wpflatfinance.zip   # a stable name, so .../releases/latest/download/wpflatfinance.zip always works
          unzip -l wpflatfinance.zip | tail -1

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wpflatfinance-${{ env.VERSION }}.zip
            wpflatfinance.zip
          generate_release_notes: true
